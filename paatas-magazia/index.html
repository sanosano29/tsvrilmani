<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ათასი წვრილმანი | კატალოგი</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --whatsapp: #25D366;
      --phone: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header */
    header {
      background: #fff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .quick-contacts {
      display: flex;
      gap: 0.5rem;
    }

    .contact-btn {
      text-decoration: none;
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: white;
      transition: opacity 0.2s;
    }

    .contact-btn:hover { opacity: 0.9; }
    .btn-wa { background: var(--whatsapp); }
    .btn-call { background: var(--phone); }

    /* Container */
    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      flex-grow: 1;
      width: 100%;
    }

    /* Search & Filter */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .search-input {
      width: 100%;
      max-width: 400px;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }

    .search-input:focus { border-color: var(--primary); }

    .filters {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }

    .filter-btn {
      background: #fff;
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      white-space: nowrap;
      transition: 0.2s;
    }

    .filter-btn.active, .filter-btn:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
    }

    .card-img-wrapper {
      height: 180px;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-fallback-icon {
      font-size: 3rem;
      color: var(--text-muted);
    }

    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-category {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 1rem;
      border-top: 1px dashed var(--border);
    }

    .price {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
    }

    .buy-link {
      background: #eff6ff;
      color: var(--primary);
      text-decoration: none;
      padding: 0.45rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: background 0.2s;
    }

    .buy-link:hover {
      background: var(--primary);
      color: #fff;
    }

    /* Footer Info */
    footer {
      background: #fff;
      border-top: 1px solid var(--border);
      padding: 2.5rem 1.5rem;
      margin-top: 3rem;
    }

    .footer-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1.5rem;
    }

    .footer-text h3 {
      font-size: 1.2rem;
      margin-bottom: 0.3rem;
    }

    .footer-text p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .contact-channels {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
  </style>
</head>
<body>

  <!-- ჰედერი -->
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">
        <i class="fa-solid fa-boxes-stacked"></i>
        <span>ათასი წვრილმანი</span>
      </a>
      <div class="quick-contacts">
        <a href="https://wa.me/48573404327" target="_blank" class="contact-btn btn-wa">
          <i class="fa-brands fa-whatsapp"></i> WhatsApp
        </a>
        <a href="tel:+48573404327" class="contact-btn btn-call">
          <i class="fa-solid fa-phone"></i> დარეკვა
        </a>
      </div>
    </div>
  </header>

  <!-- მთავარი კონტენტი -->
  <main class="container">
    <div class="controls">
      <input type="text" id="search" class="search-input" placeholder="🔍 მოძებნეთ ნივთი..." oninput="filterData()">
      <div class="filters" id="category-filters"></div>
    </div>

    <div class="grid" id="products-grid"></div>
  </main>

  <!-- საკონტაქტო ფუტერი -->
  <footer>
    <div class="footer-container">
      <div class="footer-text">
        <h3>შეძენა & კონსულტაცია</h3>
        <p>ნივთის შესაძენად ან შეკითხვებისთვის დაგვიკავშირდით ნებისმიერ დროს.</p>
      </div>
      <div class="contact-channels">
        <a href="https://wa.me/48573404327" target="_blank" class="contact-btn btn-wa">
          <i class="fa-brands fa-whatsapp"></i> WhatsApp: +48 573 404 327
        </a>
        <a href="tel:+48573404327" class="contact-btn btn-call">
          <i class="fa-solid fa-phone"></i> +48 573 404 327
        </a>
      </div>
    </div>
  </footer>

  <script>
    // პროდუქტების სია
    // სურათის დასამატებლად: image: "images/ფოტოს_სახელი.jpg"
  const products = [
      { 
        id: 1, 
        title: "სახრახნისების კომპლექტი", 
        category: "ხელსაწყოები", 
        price: 18.50, 
        image: "images/saxraxnisi.png", 
        icon: "fa-screwdriver-wrench" 
      },
      { 
        id: 2, 
        title: "USB-C სწრაფი კაბელი (1მ)", 
        category: "ელექტრონიკა", 
        price: 9.00, 
        image: "images/kabeli.png", 
        icon: "fa-bolt" 
      },
      { 
        id: 3, 
        title: "იზოლენტა (3 ცალი)", 
        category: "ხელსაწყოები", 
        price: 4.50, 
        image: "images/izolenta.png", 
        icon: "fa-tape" 
      },
      { 
        id: 4, 
        title: "LED მინი ფანარი", 
        category: "ელექტრონიკა", 
        price: 12.00, 
        image: "images/fanari.png", 
        icon: "fa-lightbulb" 
      },
      { 
        id: 5, 
        title: "სწრაფი წებო (Super Glue)", 
        category: "სახლი & ეზო", 
        price: 2.00, 
        image: "images/tsebo.png", 
        icon: "fa-droplet" 
      },
      { 
        id: 6, 
        title: "ორმხრივი წებოვანი ლენტი", 
        category: "სახლი & ეზო", 
        price: 6.00, 
        image: "images/ormmxrivi.png", 
        icon: "fa-layer-group" 
      },
      { 
        id: 7, 
        title: "საკანცელარიო დანა", 
        category: "საკანცელარიო", 
        price: 3.50, 
        image: "images/dana.png", 
        icon: "fa-scissors" 
      },
      { 
        id: 8, 
        title: "კაბელის სამაგრები (100ც)", 
        category: "ელექტრონიკა", 
        price: 5.00, 
        image: "images/samagrebi.png", 
        icon: "fa-network-wired" 
      },
      { 
        id: 9, 
        title: "რადიატორის / ხელის გასაღები", 
        category: "ხელსაწყოები", 
        price: 8.50, 
        image: "images/gasaghebi.png", 
        icon: "fa-wrench" 
      },
      { 
        id: 10, 
        title: "საზომი რულეტკა (5მ)", 
        category: "ხელსაწყოები", 
        price: 7.00, 
        image: "images/ruletka.png", 
        icon: "fa-ruler-combined" 
      }
    ];
    let activeCategory = 'all';

    function renderProducts(items) {
      const grid = document.getElementById("products-grid");
      if (items.length === 0) {
        grid.innerHTML = `<p style="color:var(--text-muted); grid-column: 1/-1; text-align:center; padding: 2rem;">პროდუქტი ვერ მოიძებნა</p>`;
        return;
      }

      grid.innerHTML = items.map(p => `
        <div class="card">
          <div class="card-img-wrapper">
            ${p.image ? `<img src="${p.image}" class="card-img" alt="${p.title}" onerror="this.onerror=null;this.parentElement.innerHTML='<i class=\\'fa-solid ${p.icon || 'fa-box'}\\' style=\\'font-size:3rem;color:#64748b;\\'></i>'">` : `<i class="fa-solid ${p.icon || 'fa-box'} card-fallback-icon"></i>`}
          </div>
          <div class="card-body">
            <span class="card-category">${p.category}</span>
            <div class="card-title">${p.title}</div>
            <div class="card-footer">
              <span class="price">${p.price.toFixed(2)} ₾</span>
              <a href="https://wa.me/48573404327?text=${encodeURIComponent('გამარჯობა, მაინტერესებს ეს ნივთი: ' + p.title + ' (' + p.price.toFixed(2) + ' ₾)')}" target="_blank" class="buy-link">
                <i class="fa-brands fa-whatsapp"></i> შეძენა
              </a>
            </div>
          </div>
        </div>
      `).join("");
    }

    function renderFilters() {
      const categories = ['all', ...new Set(products.map(p => p.category))];
      const filterBox = document.getElementById("category-filters");
      filterBox.innerHTML = categories.map(cat => `
        <button class="filter-btn ${cat === activeCategory ? 'active' : ''}" onclick="setCategory('${cat}')">
          ${cat === 'all' ? 'ყველა' : cat}
        </button>
      `).join("");
    }

    function setCategory(cat) {
      activeCategory = cat;
      renderFilters();
      filterData();
    }

    function filterData() {
      const term = document.getElementById("search").value.toLowerCase();
      const filtered = products.filter(p => {
        const matchesCategory = (activeCategory === 'all' || p.category === activeCategory);
        const matchesSearch = p.title.toLowerCase().includes(term);
        return matchesCategory && matchesSearch;
      });
      renderProducts(filtered);
    }

    // ინიციალიზაცია
    renderFilters();
    renderProducts(products);
  </script>
</body>
</html>
